services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the project-root .env}
      MYSQL_DATABASE: ai_doc_assistant
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    environment:
      # Overrides DATABASE_URL from backend/.env so the container talks to the db service
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/ai_doc_assistant
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_db
      - hf_cache:/root/.cache/huggingface

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  chroma_data:
  mysql_data:
  hf_cache:
